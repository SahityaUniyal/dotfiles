
# ================================
# Command Shortcuts
# ================================
bind C-k clear-history

# ================================
# True Color Support
# ================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

set -g extended-keys always

# ================================
# General Behavior
# ================================
set -g mouse on

# Leader key change
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start index from 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ================================
# Vim-style Navigation
# ================================
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Shift + Alt (vim style) to switch windows
bind -n M-L next-window
bind -n M-H previous-window

# ================================
# Clipboard
# ================================
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ================================
# Reload Config
# ================================
unbind r
bind r source-file $HOME/.tmux.conf

# ================================
# Open Panes/Windows in Same Path
# ================================
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ================================
# Tokyo Night Moon Theme Colors
# ================================
thm_bg="#222436"
thm_cyan="#86e1fc"
thm_gray="#3a3f5a"
thm_blue="#82aaff"
thm_black4="#444a73"

# ================================
# Status Bar
# ================================
set -g status on
set -g status-bg "${thm_bg}"
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Left side (Logo + Session Name)
set -g status-left "#[fg=${thm_blue},bold] ⧉ #[fg=${thm_cyan}]#S #[fg=${thm_gray}]❱ "

# ================================
# Messages
# ================================
# set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
# set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# ================================
# Panes
# ================================
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# ================================
# Windows - Inactive
# ================================
set -g window-status-style "fg=${thm_gray},bg=${thm_bg},none"
set -g window-status-format " #I:#W "

# ================================
# Windows - Active (Selected)
# ================================
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_black4},bold] #I:#W "

# ================================
# Status Right (empty as requested)
# ================================
set -g status-right ""

# ================================
# Modes
# ================================
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"
